[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic-av"
version = "0.1.0"
description = "MOSAIC-AV — multimodal audio-video deepfake authentication research prototype"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "av>=13.0",
    "soundfile>=0.12",
    "torch>=2.3",
    "c2pa-python>=0.30",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
filterwarnings = [
    "error::RuntimeWarning",
    "ignore::DeprecationWarning",
]
